name: Regenerate package-lock and vendor files

on:
  workflow_dispatch: {}
  push:
    branches:
      - refactor/dependabot-frontend

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies and build vendor files (regenerate lockfile)
        working-directory: webapp
        run: |
          # Remove the placeholder package-lock.json so npm can generate a fresh one
          rm -f package-lock.json
          npm install --no-audit --no-fund
          npm run build

      - name: Commit any generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add webapp/package-lock.json webapp/static/vendor || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: regenerate package-lock.json and build vendor files [automated]"
          git push origin HEAD:refactor/dependabot-frontend
